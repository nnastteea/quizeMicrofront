name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      - name: Install dependencies
        run: npm install
        working-directory: ./quize-microfront
      
      - name: Run Tests
        run: npm run test
        working-directory: ./quize-microfront

      - name: Run Tests with Coverage
        run: npm run test:coverage
        working-directory: ./quize-microfront
