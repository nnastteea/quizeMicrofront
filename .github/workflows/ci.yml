name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Linter from Monorepo
        run: |
          npm install
          npm run lint
        working-directory: ./
        
      - name: Install dependencies
        run: npm install
      
      - name: Run Tests
        run: npm run test

      - name: Run Tests with Coverage
        run: npm run test:coverage
